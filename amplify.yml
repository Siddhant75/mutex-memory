version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@10.34.5 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @mutex-memory/web build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/.pnpm/**/*
